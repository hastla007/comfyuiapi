global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'comfyui-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configurations
scrape_configs:
  # ComfyUI API metrics
  - job_name: 'comfyui-api'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'comfyui-api'
    metrics_path: '/api/health/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Docker metrics (optional - requires cAdvisor)
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
