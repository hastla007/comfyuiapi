version: '3.8'

services:
  # Backend API for managing ComfyUI containers
  api:
    build: ./backend
    container_name: comfyui-api
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workflows:/app/workflows
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=comfyui
      - DB_USER=comfyui
      - DB_PASSWORD=comfyui_password
    networks:
      - comfyui-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend web interface
  frontend:
    build: ./frontend
    container_name: comfyui-frontend
    ports:
      - "8080:80"
    environment:
      - API_URL=http://api:3000
    networks:
      - comfyui-network
    depends_on:
      - api
    restart: unless-stopped

  # Database for storing configurations
  db:
    image: postgres:15-alpine
    container_name: comfyui-db
    environment:
      - POSTGRES_DB=comfyui
      - POSTGRES_USER=comfyui
      - POSTGRES_PASSWORD=comfyui_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - comfyui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfyui"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ComfyUI Instance 1 (template - can be scaled)
  comfyui-1:
    build: ./comfyui
    container_name: comfyui-instance-1
    ports:
      - "8188:8188"
    volumes:
      - ./models:/app/models
      - ./workflows/instance-1:/app/workflows
      - ./output:/app/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - INSTANCE_ID=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - comfyui-network
    restart: unless-stopped

  # ComfyUI Instance 2
  comfyui-2:
    build: ./comfyui
    container_name: comfyui-instance-2
    ports:
      - "8189:8188"
    volumes:
      - ./models:/app/models
      - ./workflows/instance-2:/app/workflows
      - ./output:/app/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - INSTANCE_ID=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - comfyui-network
    restart: unless-stopped

networks:
  comfyui-network:
    driver: bridge

volumes:
  db-data:
