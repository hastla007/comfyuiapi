version: '3.8'

services:
  # Backend API for managing ComfyUI containers
  api:
    build: ./backend
    container_name: comfyui-api
    ports:
      - "3006:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workflows:/app/workflows
      - ./models:/app/models
      - ./config:/app/config
      - ./backend/logs:/app/logs
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - VOLUME_BASE=${PWD:-/home/user/comfyuiapi}
      - COMFYUI_IMAGE=${COMFYUI_IMAGE:-comfyuiapi-comfyui:latest}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-comfyui}
      - DB_USER=${DB_USER:-comfyui}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - comfyui-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend web interface
  frontend:
    build: ./frontend
    container_name: comfyui-frontend
    ports:
      - "8081:80"
    environment:
      - API_URL=http://api:3000
    networks:
      - comfyui-network
    depends_on:
      - api
    restart: unless-stopped

  # Database for storing configurations
  db:
    image: postgres:15-alpine
    container_name: comfyui-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-comfyui}
      - POSTGRES_USER=${DB_USER:-comfyui}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - comfyui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-comfyui}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ComfyUI Instance 1 (template - can be scaled)
  comfyui-1:
    build: ./comfyui
    container_name: comfyui-instance-1
    ports:
      - "8188:8188"
    volumes:
      - ./models:/app/models
      - ./workflows/instance-1:/app/workflows
      - ./output:/app/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - INSTANCE_ID=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - comfyui-network
    restart: unless-stopped

  # ComfyUI Instance 2
  comfyui-2:
    build: ./comfyui
    container_name: comfyui-instance-2
    ports:
      - "8189:8188"
    volumes:
      - ./models:/app/models
      - ./workflows/instance-2:/app/workflows
      - ./output:/app/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - INSTANCE_ID=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - comfyui-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: comfyui-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - comfyui-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: comfyui-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - comfyui-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  comfyui-network:
    driver: bridge

volumes:
  db-data:
  prometheus-data:
  grafana-data:
